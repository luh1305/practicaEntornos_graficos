<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="estilo.css" rel="stylesheet">
  <title>Práctica 2 · Ejercicio 2</title>
</head>
<body>

  <div class="container my-4">

    <!-- Encabezado -->
    <div class="row g-3 mb-3">
      <div class="col-12">
        <header class="bloque bloque-violeta"></header>
      </div>
    </div>

    <div class="row g-3">

      <!-- Sidebar: 3 de 12 columnas en md+, 100% en sm o menos -->
      <div class="col-12 col-md-3">
        <aside class="bloque bloque-rosa bloque-lateral"></aside>
      </div>

      <!-- Zona central: 9 de 12 columnas, con una grilla anidada -->
      <div class="col-12 col-md-9">
        <div class="row g-3">

          <!-- Barra verde -->
          <div class="col-12"><div class="bloque bloque-verde"></div></div>

          <!-- 6 rectángulos violetas: 3 por fila en md+, 2 por fila en sm -->
          <div class="col-6 col-md-4"><div class="bloque bloque-gris"></div></div>
          <div class="col-6 col-md-4"><div class="bloque bloque-gris"></div></div>
          <div class="col-6 col-md-4"><div class="bloque bloque-gris"></div></div>
          <div class="col-6 col-md-4"><div class="bloque bloque-gris"></div></div>
          <div class="col-6 col-md-4"><div class="bloque bloque-gris"></div></div>
          <div class="col-6 col-md-4"><div class="bloque bloque-gris"></div></div>

          <!-- Rectángulos celestes: chico + grande (el doble de ancho) en md+.
               En sm los dos miden lo mismo. -->
          <div class="col-6 col-md-4"><div class="bloque bloque-azul"></div></div>
          <div class="col-6 col-md-8"><div class="bloque bloque-azul"></div></div>

        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
