<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="estilo.css" rel="stylesheet">
  <title>Práctica 2 · Ejercicio 1</title>
</head>
<body>

  <div class="container my-4">

    <!-- Fila 1: una columna al 100% en todas las resoluciones -->
    <div class="row g-3 mb-3">
      <div class="col-12">
        <div class="bloque bloque-ej1 bloque-violeta"></div>
      </div>
    </div>

    <!-- Fila 2: en md o más = 2 columnas del 50%.
         En sm o menos (sin prefijo md) cada columna pasa a ocupar el 100%,
         por lo que en total se ven 3 filas apiladas. -->
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <div class="bloque bloque-ej1 bloque-ej1-beige"></div>
      </div>
      <div class="col-12 col-md-6">
        <div class="bloque bloque-ej1 bloque-ej1-rosa"></div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
