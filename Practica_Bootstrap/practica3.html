<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="estilo.css" rel="stylesheet">
  <title>Práctica 3 · Componentes</title>
</head>
<body>

  <div class="container my-4">

    <!-- Encabezado -->
    <div class="row g-3 mb-3">
      <div class="col-12">
        <header class="bloque bloque-violeta text-white">
          <h1 class="h3 m-0">Entornos Gráficos · Práctica Bootstrap</h1>
        </header>
      </div>
    </div>

    <div class="row g-3">

      <!-- Sidebar con botón que abre el modal (Ej. 2) -->
      <div class="col-12 col-md-3">
        <aside class="bloque bloque-rosa bloque-lateral">
          <button type="button" class="btn btn-primary"
                  data-bs-toggle="modal" data-bs-target="#modalGuardar">
            Abrir modal
          </button>
        </aside>
      </div>

      <div class="col-12 col-md-9">
        <div class="row g-3">

          <!-- Ej. 1: alerta dentro del div verde -->
          <div class="col-12">
            <div class="bloque bloque-verde">
              <div class="alert alert-success mb-0" role="alert">
                ¡Todo salió bien! Este es un mensaje de éxito.
              </div>
            </div>
          </div>

          <!-- Ej. 3: card en 4 de los rectángulos violetas -->
          <div class="col-6 col-md-4">
            <div class="bloque bloque-gris">
              <div class="card h-100">
                <img src="img/card.svg" class="card-img-top" alt="Imagen cualquiera">
                <div class="card-body">
                  <h5 class="card-title">Título</h5>
                  <p class="card-text">Texto descriptivo</p>
                  <a href="#" class="btn btn-primary">Link</a>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-4">
            <div class="bloque bloque-gris">
              <div class="card h-100">
                <img src="img/card.svg" class="card-img-top" alt="Imagen cualquiera">
                <div class="card-body">
                  <h5 class="card-title">Título</h5>
                  <p class="card-text">Texto descriptivo</p>
                  <a href="#" class="btn btn-primary">Link</a>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-4">
            <div class="bloque bloque-gris">
              <div class="card h-100">
                <img src="img/card.svg" class="card-img-top" alt="Imagen cualquiera">
                <div class="card-body">
                  <h5 class="card-title">Título</h5>
                  <p class="card-text">Texto descriptivo</p>
                  <a href="#" class="btn btn-primary">Link</a>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-4">
            <div class="bloque bloque-gris">
              <div class="card h-100">
                <img src="img/card.svg" class="card-img-top" alt="Imagen cualquiera">
                <div class="card-body">
                  <h5 class="card-title">Título</h5>
                  <p class="card-text">Texto descriptivo</p>
                  <a href="#" class="btn btn-primary">Link</a>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-4"><div class="bloque bloque-gris"></div></div>
          <div class="col-6 col-md-4"><div class="bloque bloque-gris"></div></div>

          <!-- Rectángulo celeste chico -->
          <div class="col-6 col-md-4"><div class="bloque bloque-azul"></div></div>

          <!-- Ej. 4: slider con 3 imágenes en el celeste grande -->
          <div class="col-6 col-md-8">
            <div class="bloque bloque-azul">
              <div id="slider" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-indicators">
                  <button type="button" data-bs-target="#slider" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Imagen 1"></button>
                  <button type="button" data-bs-target="#slider" data-bs-slide-to="1" aria-label="Imagen 2"></button>
                  <button type="button" data-bs-target="#slider" data-bs-slide-to="2" aria-label="Imagen 3"></button>
                </div>
                <div class="carousel-inner">
                  <div class="carousel-item active"><img src="img/slide1.svg" class="d-block w-100" alt="Imagen 1"></div>
                  <div class="carousel-item"><img src="img/slide2.svg" class="d-block w-100" alt="Imagen 2"></div>
                  <div class="carousel-item"><img src="img/slide3.svg" class="d-block w-100" alt="Imagen 3"></div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#slider" data-bs-slide="prev">
                  <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                  <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#slider" data-bs-slide="next">
                  <span class="carousel-control-next-icon" aria-hidden="true"></span>
                  <span class="visually-hidden">Siguiente</span>
                </button>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- Ej. 2: modal con 2 botones -->
  <div class="modal fade" id="modalGuardar" tabindex="-1" aria-labelledby="modalGuardarLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalGuardarLabel">Título del modal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p class="mb-0">Contenido del modal.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="button" class="btn btn-primary">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
