<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicio 2 - Audio HTML5</title>
</head>
<body>
  <h1>Ejercitación 2: Audio</h1>
  <h2>2.A) Formatos de audio</h2>
  <p>Formatos habituales en la web: MP3, WAV y Ogg/Vorbis.
     La compatibilidad exacta depende del navegador y del códec.</p>
  <h2>2.B) Elemento audio</h2>
  <audio controls preload="metadata">
    <source src="https://html5tutorial.info/media/vincent.mp3" type="audio/mpeg">
    Tu navegador no admite el elemento de audio.
  </audio>
  <p>El recurso de audio requiere conexión a Internet y que el servidor de origen esté disponible.</p>
</body>
</html>
